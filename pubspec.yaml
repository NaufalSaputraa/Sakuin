name: sakuin_app
description: "Sakuin (ç´¢å¼•) - Indonesian personal finance tracker with dual-wallet and on-device AI."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.2

  # Serialization
  json_annotation: ^4.12.0

  # Database (Drift / SQLite)
  drift: ^2.24.2
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1

  # Navigation & Routing
  go_router: ^17.5.0

  # UI / Visuals / Charts
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  number_flow_flutter: ^0.1.0
  lottie: ^3.3.1
  google_fonts: ^8.2.1
  cupertino_icons: ^1.0.8

  # Localization
  easy_localization: ^3.0.8
  intl: ^0.20.3

  # Utility & Storage
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  dynamic_color: ^1.7.0
  flutter_secure_storage: ^11.0.0
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  # Share Import: receive text shared from banking/e-wallet apps (BCA, GoPay, OVO, Dana)
  receive_sharing_intent: ^1.8.2
  speech_to_text: ^7.1.0
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  google_mlkit_text_recognition: ^0.17.1
  quick_actions: ^1.0.8
  home_widget: ^0.9.3
  file_picker: ^12.0.0
  collection: ^1.18.0

  # On-Device LLM (LiteRT .litertlm) — Gemma 4 E2B, swappable via ModelDownloadConfig
  litertlm: ^0.0.13
  dio: ^5.7.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen stack (Flutter beta 3.48 â€” let resolver pick analyzer/build)
  drift_dev: ^2.34.0
  build_runner: ^2.16.0
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/animations/
    - assets/icons/
