name: Release APK

on:
  push:
    tags: 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version for the release (e.g., v1.0.5)'
        required: false
        default: 'v1.0.5'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Release Tag
        id: vars
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag_name || 'v1.0.5' }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs || true

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --release --split-per-abi

      # Rename APKs to include tag and architecture for clarity
      - run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p ./apks
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ./apks/sakuin-${TAG}-arm64-v8a.apk 2>/dev/null || mv build/app/outputs/flutter-apk/app-arm64-release.apk ./apks/sakuin-${TAG}-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ./apks/sakuin-${TAG}-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk ./apks/sakuin-${TAG}-x86_64.apk
          ls -lh ./apks/

      - uses: actions/upload-artifact@v4
        with:
          name: sakuin-apks-${{ steps.vars.outputs.tag }}
          path: apks/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: apks/sakuin-*.apk