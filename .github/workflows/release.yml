name: Release APK

on:
  push:
    tags: 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs || true

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --release --split-per-abi

      # Rename APKs to include tag and architecture for clarity
      - run: |
          TAG=${GITHUB_REF_NAME}
          mkdir -p ./apks
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ./apks/sakuin-${TAG}-arm64-v8a.apk 2>/dev/null || mv build/app/outputs/flutter-apk/app-arm64-release.apk ./apks/sakuin-${TAG}-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ./apks/sakuin-${TAG}-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk ./apks/sakuin-${TAG}-x86_64.apk
          ls -lh ./apks/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apks/sakuin-*.apk